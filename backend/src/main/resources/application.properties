# ============================================================
# FAZZI MART - Spring Boot Configuration
# ============================================================
spring.application.name=fazzi-mart-backend
server.port=9090

# ------------------------------------------------------------
# Data storage: Excel files (no MySQL), same approach as DhanyaMart
# Data files live in:  <user home>/fazzimart-data/
#   users.xlsx  products.xlsx  cart_items.xlsx  orders.xlsx  order_items.xlsx
# To change the location, set "fazzi.data.dir"(system property/environment
# variable FAZZIMART_DATA_DIR) or edit the value below.
# ------------------------------------------------------------
fazzi.data.dir=

# ------------------------------------------------------------
# JWT (JSON Web Token) configuration
# ------------------------------------------------------------
fazzi.jwt.secret=FAZZIMART_PETSHOP_SECRET_KEY_2024_0123456789_9876543210_SUPER_SAFE
fazzi.jwt.expiration=86400000