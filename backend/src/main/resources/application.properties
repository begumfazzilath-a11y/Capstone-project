# ============================================================
# FAZZI MART - Spring Boot Configuration
# ============================================================
spring.application.name=fazzi-mart-backend
server.port=9090

# ------------------------------------------------------------
# Frontend integration: serve the static site from the same app
# So the whole store runs at a single URL: http://localhost:9090
#  - Local runs:   the "frontend" folder next to "backend" is used as-is
#    (live edits are picked up, no rebuild needed)
#  - JAR deploys:  the frontend is bundled into the JAR at
#    classpath:/static/ (copied there by pom.xml at package time), and the
#    file:../frontend/ location simply doesn't exist on the server.
# Spring tries each location in order and uses the first one that has a file.
# ------------------------------------------------------------
spring.web.resources.static-locations=file:../frontend/,classpath:/static/

# ------------------------------------------------------------
# MySQL 8 database (JDBC) - same approach as DhanyaMart
# Connection settings live in  db.properties  (same folder as this file):
#   src/main/resources/db.properties
# It stores  db.url / db.user / db.password  and can be overridden with
# system properties (fazzimart.db.url / db.user / db.password) or the
# environment variables DB_URL / DB_USER / DB_PASSWORD.
# The schema (database/fazzi_mart.sql) is created automatically on the
# first connection, or run the script by hand with:
#   mysql -u root -p < database/fazzi_mart.sql
# ------------------------------------------------------------

# ------------------------------------------------------------
# JWT (JSON Web Token) configuration
# ------------------------------------------------------------
# Overridable via the FAZZI_JWT_SECRET env var (set it on Render/Railway so
# deployed instances do not all share the same signing key).
fazzi.jwt.secret=${FAZZI_JWT_SECRET:FAZZIMART_PETSHOP_SECRET_KEY_2024_0123456789_9876543210_SUPER_SAFE}
fazzi.jwt.expiration=86400000