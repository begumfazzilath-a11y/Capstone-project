# ============================================================
# FAZZI MART - Spring Boot Configuration
# ============================================================
spring.application.name=fazzi-mart-backend
server.port=8080

# ------------------------------------------------------------
# MySQL 8 Database config
# (createDatabaseIfNotExist=true auto-creates "fazzi_mart")
# Change username / password to match your local MySQL setup.
# ------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/fazzi_mart?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Manila&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------
# JPA / Hibernate
# ("update" lets Hibernate create/update the tables automatically)
# ------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------
# JWT (JSON Web Token) configuration
# ------------------------------------------------------------
fazzi.jwt.secret=FAZZIMART_PETSHOP_SECRET_KEY_2024_0123456789_9876543210_SUPER_SAFE
fazzi.jwt.expiration=86400000