<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | FAZZI MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main>
        <div class="container py-4">
            <h1 class="section-title mb-4">Checkout <i class="bi bi-cart-check text-fm"></i></h1>

            <div class="row g-4">
                <!-- Customer & delivery details -->
                <div class="col-lg-7">
                    <form id="checkoutForm" novalidate>
                        <div class="form-section mb-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-person me-2 text-fm"></i>Customer Details</h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="customerName" class="form-label">Full Name</label>
                                    <input type="text" class="form-control" id="customerName" placeholder="Juan Dela Cruz">
                                    <div class="invalid-feedback" id="customerNameError"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="0917 123 4567">
                                    <div class="invalid-feedback" id="phoneError"></div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section mb-4">
                            <h5 class="fw-bold mb-3"><i class="bi bi-geo-alt me-2 text-fm"></i>Delivery Address</h5>
                            <div class="row g-3">
                                <div class="col-12">
                                    <label for="address" class="form-label">Street Address</label>
                                    <input type="text" class="form-control" id="address" placeholder="123 Pet Street, Barangay">
                                    <div class="invalid-feedback" id="addressError"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="city" class="form-label">City</label>
                                    <input type="text" class="form-control" id="city" placeholder="Manila">
                                    <div class="invalid-feedback" id="cityError"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="postalCode" class="form-label">Postal Code</label>
                                    <input type="text" class="form-control" id="postalCode" placeholder="1000">
                                    <div class="invalid-feedback" id="postalCodeError"></div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Order summary -->
                <div class="col-lg-5">
                    <div class="summary-card p-4">
                        <h5 class="fw-bold mb-3">Your Order</h5>
                        <div id="orderSummaryItems">
                            <div class="spinner-wrap">Loading cart...</div>
                        </div>
                        <hr>
                        <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">PHP 0.00</span></div>
                        <div class="summary-row"><span>Shipping</span><span class="text-success">FREE</span></div>
                        <div class="summary-row total"><span>Total</span><span id="summaryTotal">PHP 0.00</span></div>
                        <button class="btn btn-fm w-100 py-2 mt-3" id="placeOrderBtn">
                            <i class="bi bi-check-circle"></i> Place Order
                        </button>
                        <a href="cart.html" class="btn btn-outline-fm w-100 mt-2">
                            <i class="bi bi-arrow-left"></i> Back to Cart
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Order success modal -->
    <div class="modal fade" id="orderSuccessModal" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content text-center p-4" style="border-radius:20px;">
                <div class="empty-icon mb-2">🎉</div>
                <h4 class="fw-bold text-success">Order Placed Successfully!</h4>
                <p class="text-muted">Thank you for shopping with FAZZI MART.</p>
                <div class="bg-light rounded-3 p-3 mb-3">
                    <div class="small text-muted">Your Order ID</div>
                    <div class="fs-3 fw-bold text-fm" id="orderIdDisplay">#0000</div>
                </div>
                <p class="small text-muted mb-4" id="orderTotalDisplay"></p>
                <div class="d-flex gap-2 justify-content-center">
                    <a href="products.html" class="btn btn-outline-fm px-3">Continue Shopping</a>
                    <a href="account.html" class="btn btn-fm px-3">My Orders</a>
                </div>
            </div>
        </div>
    </div>

    <div id="pageFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/checkout.js"></script>
</body>
</html>
