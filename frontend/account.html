<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | FAZZI MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main>
        <div class="container py-4">
            <h1 class="section-title mb-4">My Account <i class="bi bi-person-circle text-fm"></i></h1>

            <div class="row g-4">
                <div class="col-lg-4">
                    <div id="profileCard">
                        <div class="spinner-wrap">Loading profile...</div>
                    </div>
                </div>
                <div class="col-lg-8">
                    <div class="d-flex flex-wrap align-items-center justify-content-between mb-3">
                        <h4 class="fw-bold mb-0">Order History</h4>
                        <a href="products.html" class="btn btn-outline-fm btn-sm">
                            <i class="bi bi-plus-circle"></i> New Order</a>
                    </div>
                    <div id="orderHistory">
                        <div class="spinner-wrap">Loading orders...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="pageFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
