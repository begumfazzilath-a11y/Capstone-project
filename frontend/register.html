<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | FAZZI MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
    <div class="auth-card">
        <div class="text-center">
            <div class="auth-logo">
                <svg width="52" height="52" viewBox="0 0 64 64" aria-hidden="true">
                    <ellipse cx="20" cy="22" rx="6" ry="9" transform="rotate(-20 20 22)" fill="#fff"/>
                    <ellipse cx="44" cy="22" rx="6" ry="9" transform="rotate(20 44 22)" fill="#fff"/>
                    <ellipse cx="11" cy="37" rx="6" ry="9" transform="rotate(-45 11 37)" fill="#fff"/>
                    <ellipse cx="53" cy="37" rx="6" ry="9" transform="rotate(45 53 37)" fill="#fff"/>
                    <ellipse cx="32" cy="48" rx="15" ry="12" fill="#fff"/>
                    <ellipse cx="32" cy="44" rx="8" ry="6" fill="#ffb37e"/>
                </svg>
            </div>
            <div class="auth-brand">
                <h1>FAZZI <span>MART</span></h1>
                <p class="auth-tagline">Happy Pets. Better Care. Easy Shopping.</p>
            </div>
        </div>

        <h2 class="text-center fw-bold fs-4">Create Your Account</h2>
        <p class="text-center text-muted small mb-4">Join FAZZI MART and start shopping for your pets.</p>

        <div class="error-box" id="registerError"></div>

        <form id="registerForm" novalidate>
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Juan Dela Cruz" autocomplete="name">
                <div class="invalid-feedback" id="nameError"></div>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone Number</label>
                <input type="tel" class="form-control" id="phone" placeholder="0917 123 4567" autocomplete="tel">
                <div class="invalid-feedback" id="phoneError"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email">
                <div class="invalid-feedback" id="emailError"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" placeholder="Minimum 6 characters" autocomplete="new-password">
                    <button class="btn btn-ghost" type="button" id="togglePassword" tabindex="-1" aria-label="Show or hide password">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="invalid-feedback" id="passwordError"></div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password">
                <div class="invalid-feedback" id="confirmPasswordError"></div>
            </div>

            <button type="submit" class="btn btn-fm w-100 py-2 mb-3" id="registerBtn">
                <i class="bi bi-person-plus"></i> Create Account
            </button>
        </form>

        <div class="auth-divider mt-1 mb-3">Already have an account?</div>

        <p class="text-center mb-0">
            <a href="index.html" class="text-fm fw-bold">Back to Login</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
