<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | FAZZI MART</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="navbar"></div>

    <main>
        <!-- Page header -->
        <section class="py-4" style="background: linear-gradient(135deg, var(--fm-navy), #41527a);">
            <div class="container text-white">
                <h1 class="fw-bold mb-1">Pet Products</h1>
                <p class="mb-0 opacity-75">Search, filter and sort our complete pet shop collection.</p>
            </div>
        </section>

        <!-- Filters -->
        <section class="py-4 bg-white shadow-sm">
            <div class="container">
                <div class="row g-3 align-items-center">
                    <div class="col-lg-4">
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                            <input type="search" class="form-control" id="searchInput" placeholder="Search products...">
                            <button class="btn btn-fm" type="button" id="searchBtn">
                                <i class="bi bi-search"></i><span class="d-none d-md-inline ms-1">Search</span>
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-5">
                        <div class="d-flex flex-wrap gap-2" id="categoryPills"></div>
                    </div>
                    <div class="col-lg-3">
                        <select class="form-select" id="sortSelect">
                            <option value="default">Sort: Default</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                            <option value="name_asc">Name: A-Z</option>
                            <option value="rating_desc">Rating: High to Low</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <section class="py-4">
            <div class="container">
                <p class="text-muted small mb-3" id="resultsInfo"></p>
                <div class="row g-3" id="productGrid">
                    <div class="spinner-wrap">Loading products...</div>
                </div>
            </div>
        </section>
    </main>

    <div id="pageFooter"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/common.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
