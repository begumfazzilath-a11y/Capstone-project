# Render.com Blueprint - https://dashboard.render.com/select-repo?type=blueprint
#
# How to deploy:
#   1. Push this repo to GitHub (origin already points at it).
#   2. Render dashboard -> New -> Blueprint instance -> pick the repo.
#   3. Render builds the Dockerfile, injects a dynamic $PORT, and the
#      docker-entrypoint.sh forwards it to Spring Boot.
#   4. Render has NO managed MySQL, so point the app at any MySQL 8
#      (Aiven free tier, Railway, Planetscale, ...). After importing,
#      open the service -> Environment and fill in:
#        DB_URL         e.g. jdbc:mysql://HOST:PORT/fazzimart?createDatabaseIfNotExist=true&useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
#        DB_USER
#        DB_PASSWORD
#        FAZZI_JWT_SECRET   (optional - any long random string)
#      All four are marked "sync: false" so Render never overwrites them
#      on redeploys. The app tolerates a database that is still starting
#      up (the seeder retries in the background), so the first boot should
#      go healthy even if MySQL takes a minute.
services:
  - type: web
    name: fazzimart
    runtime: docker
    repo: https://github.com/begumfazzilath-a11y/Capstone-project.git
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /index.html
    autoDeploy: true
    envVars:
      - key: DB_URL
        sync: false   # set in the dashboard
      - key: DB_USER
        sync: false   # set in the dashboard
      - key: DB_PASSWORD
        sync: false   # set in the dashboard
      - key: FAZZI_JWT_SECRET
        sync: false   # optional - set in the dashboard